[mypy]
python_version = 3.10
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = false
ignore_missing_imports = true
follow_imports = silent
disable_error_code = var-annotated, union-attr, assignment, attr-defined, call-overload, misc, dict-item, return-value, arg-type, operator, import-untyped, call-arg, override, index, no-any-return, import-not-found, no-untyped-def
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

[mypy-numpy.*]
ignore_missing_imports = true

[mypy-rich.*]
ignore_missing_imports = true

[mypy-pytest.*]
ignore_missing_imports = true
