# Controlled evolutionary benchmark.
# The task is OneMax over the CA seed grid: maximize active cells.

seed: 42

execution:
  generations: 25
  population_size: 24
  output_dir: ./artifacts/ca_onemax_evolution
  selection_mode: tournament
  survival_rate: 0.5
  crossover_rate: 0.0
  run_held_out_benchmark: false

evo:
  ca:
    grid_size: [10, 10]
    rule_range: [30, 255]
    steps_range: [4, 12]
    initial_density: 0.25
  rank_candidates: [4, 8, 16]
  alpha_candidates: [8, 16, 32]
  dropout_candidates: [0.05, 0.1, 0.2]
  target_modules: ["q_proj", "v_proj"]

experiment:
  target: ca_onemax
  name: ca_onemax_evolution
  dataset:
    path: ./datasets
    datasets: ["ca_onemax"]
    max_samples: 1
  model:
    name: no_model_required
    max_seq_length: 128

training:
  batch_size: 1
  gradient_accumulation_steps: 1
  epochs: 1
  learning_rate: 2e-4
  warmup_steps: 0
  logging_steps: 1
  save_steps: 10
  max_grad_norm: 1.0
  weight_decay: 0.01
  adam_epsilon: 1e-8

evaluation:
  test_samples: 1
  fitness_weights:
    bugfix: 0.2
    style: 0.2
    security: 0.2
    runtime: 0.2
    syntax: 0.2
  baseline_testing:
    enabled: false

infra:
  executor: local

cache:
  artifacts_dir: ./artifacts/ca_onemax_evolution
  base_checkpoint: no_model_required
  cleanup_threshold: 10

threshold:
  base_thresholds:
    bugfix: 0.0
    style: 0.0
    security: 0.0
    runtime: 0.0
    syntax: 0.0
  max_thresholds:
    bugfix: 0.0
    style: 0.0
    security: 0.0
    runtime: 0.0
    syntax: 0.0
  schedule: linear
